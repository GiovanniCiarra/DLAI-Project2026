[project]
name = "grokzip"
version = "0.1.0"
description = "Compressibility as a test-free progress measure for grokking"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grokzip"]